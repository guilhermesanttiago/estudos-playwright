<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cadastro — Pontos</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="card">
    <h1>Criar conta</h1>
    <form id="form-cadastro" novalidate>
      <label for="nome">Nome</label>
      <input id="nome" name="nome" type="text" data-testid="cadastro-nome">

      <label for="email">E-mail</label>
      <input id="email" name="email" type="email" data-testid="cadastro-email">

      <label for="senha">Senha</label>
      <input id="senha" name="senha" type="password" data-testid="cadastro-senha">

      <button type="submit" data-testid="cadastro-enviar">Cadastrar</button>
    </form>
    <div id="mensagem" class="mensagem" role="alert" data-testid="cadastro-mensagem"></div>
    <p class="link">Já tem conta? <a href="/index.html" data-testid="link-login">Entrar</a></p>
  </div>

  <script>
    const form = document.getElementById('form-cadastro');
    const msg = document.getElementById('mensagem');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const corpo = {
        nome: form.nome.value,
        email: form.email.value,
        senha: form.senha.value,
      };
      const resp = await fetch('/api/cadastro', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(corpo),
      });
      const dados = await resp.json();

      if (resp.ok) {
        msg.className = 'mensagem sucesso';
        msg.textContent = dados.mensagem + ' Redirecionando para o login...';
        form.reset();
        setTimeout(() => (window.location.href = '/index.html'), 1500);
      } else {
        msg.className = 'mensagem erro';
        msg.textContent = dados.erro;
      }
    });
  </script>
</body>
</html>
